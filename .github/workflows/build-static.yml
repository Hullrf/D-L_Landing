# Autodeploy a Hostinger (mismo patrón que el LMS, ver su docs/HOSTINGER.md).
#
# En cada push a main compila la landing como sitio estático (el servidor de Hostinger no puede
# compilar Next.js: glibc antigua) y sube site/out/ por rsync/SSH a la raíz del sitio.
# Sin los secretos configurados, el job compila y termina en verde sin desplegar.
#
# Secretos del repo: HOSTINGER_SSH_KEY, HOSTINGER_KNOWN_HOSTS, HOSTINGER_HOST, HOSTINGER_PORT,
# HOSTINGER_USER (los mismos valores que en el LMS) y HOSTINGER_PATH (ruta absoluta del
# public_html de la landing). Variable opcional NEXT_PUBLIC_LMS_URL si cambia el dominio del LMS.

name: Deploy a Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
      HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Compilar
        working-directory: site
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_LMS_URL: ${{ vars.NEXT_PUBLIC_LMS_URL }}
        run: |
          npm ci
          # variable vacía = que Next use el valor por defecto del código
          [ -n "$NEXT_PUBLIC_LMS_URL" ] || unset NEXT_PUBLIC_LMS_URL
          npm run build

      - name: Revisar secretos de deploy
        id: secretos
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          faltan=""
          for v in HOSTINGER_HOST HOSTINGER_PORT HOSTINGER_USER HOSTINGER_PATH; do
            [ -n "${!v}" ] || faltan="$faltan $v"
          done
          [ -n "$SSH_KEY" ] || faltan="$faltan HOSTINGER_SSH_KEY"
          [ -n "$KNOWN_HOSTS" ] || faltan="$faltan HOSTINGER_KNOWN_HOSTS"
          if [ -n "$faltan" ]; then
            echo "::notice::Deploy omitido, faltan secretos:$faltan"
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar SSH
        if: steps.secretos.outputs.listo == 'true'
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Subir el sitio
        if: steps.secretos.outputs.listo == 'true'
        run: |
          SSH="ssh -p $HOSTINGER_PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ConnectionAttempts=3"
          # --delete: out/ es el sitio completo; quita lo que ya no existe. Excluye lo propio de Hostinger.
          rsync -az --delete --exclude='.htaccess' --exclude='.well-known/' --exclude='cgi-bin/' \
            -e "$SSH" site/out/ "$HOSTINGER_USER@$HOSTINGER_HOST:$HOSTINGER_PATH/"

      - name: Healthcheck
        if: steps.secretos.outputs.listo == 'true'
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "https://lavender-squid-495349.hostingersite.com/"
