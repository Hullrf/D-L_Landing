# Autodeploy a Hostinger: en cada push a main compila la landing como sitio estático
# (el servidor de Hostinger no puede compilar Next.js: glibc antigua) y publica el resultado
# en la rama `hostinger-static`. El auto-deploy de Git de Hostinger (modo estático) despliega
# esa rama sola. No hace falta ningún secreto.
#
# URL del LMS: variable del repo NEXT_PUBLIC_LMS_URL (si no existe, se usa la de content.ts).

name: Build estático para Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-static
  cancel-in-progress: false

permissions:
  contents: write # empujar la rama hostinger-static

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Compilar
        working-directory: site
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_LMS_URL: ${{ vars.NEXT_PUBLIC_LMS_URL }}
        run: |
          npm ci
          # variable vacía = que Next use el valor por defecto del código
          [ -n "$NEXT_PUBLIC_LMS_URL" ] || unset NEXT_PUBLIC_LMS_URL
          npm run build

      - name: Publicar en hostinger-static
        working-directory: site/out
        run: |
          git init -q -b hostinger-static
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build: ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hostinger-static
